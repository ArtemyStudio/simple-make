name: Feature request
description: Suggest a new builder, source, or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The thing that doesn't work today, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New build system
        - New search source
        - New system package manager
        - Config option
        - Output / UX
        - Something else
    validations:
      required: true
