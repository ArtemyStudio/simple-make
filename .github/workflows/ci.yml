name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 libcurl4-openssl-dev nlohmann-json3-dev
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake llvm nlohmann-json

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        run: ./build/simple-make --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simple-make-${{ matrix.name }}
          path: build/simple-make
          if-no-files-found: error

  packages:
    name: packages (deb/rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 libcurl4-openssl-dev nlohmann-json3-dev rpm
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: cd build && cpack -G "DEB;RPM"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: simple-make-packages
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error
